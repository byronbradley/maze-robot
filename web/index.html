<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maze Robot</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Maze Robot</h1>
    <p>Blue = robot. Green = goal. Dark squares = walls.</p>

    <div id="maze"></div>

    <div id="controls">
        <button id="step-button">Step</button>
        <button id="play-button">Play</button>
        <button id="reset-button">Reset</button>
        <button id="random-button">Random Maze</button>
    </div>

    <p id="status"></p>
</body>
</html>
