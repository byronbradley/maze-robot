<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="title desc">
<title id="title">Nano 33 BLE maze robot signal wiring</title>
<desc id="desc">Nano D3 D5 D6 D9 control a DRV8833. D10 enables it and D11 reads its fault. Three HC-SR04P triggers connect to D2 D4 D7, with direct 3.3 V echoes to A0 A1 A2. D12 uses a hold-to-run button to ground. All supplies share ground.</desc>
<style>text{font-family:Arial,sans-serif;fill:#172c40;font-size:17px}.title{font-size:30px;font-weight:bold}.heading{font-size:21px;font-weight:bold}.small{font-size:15px}.box{fill:#f4f8fb;stroke:#42617c;stroke-width:2}.wire{stroke:#316c9e;stroke-width:2;fill:none}.power{fill:#fff6df;stroke:#9e7a25;stroke-width:2}.divider{fill:#e7f5ef;stroke:#367d62;stroke-width:2}</style>
<rect width="1280" height="960" fill="white"/>
<text x="40" y="48" class="title">Nano 33 BLE · DRV8833 · three HC-SR04P sensors</text>
<text x="40" y="80">Signal-name diagram. See wiring.md for carrier requirements and power checks.</text>
<rect x="40" y="130" width="340" height="390" rx="12" class="box"/>
<text x="60" y="165" class="heading">DRV8833 carrier</text>
<text x="60" y="210">AIN1 ← D3</text><text x="60" y="245">AIN2 ← D5</text>
<text x="60" y="280">BIN1 ← D6</text><text x="60" y="315">BIN2 ← D9</text>
<text x="60" y="350">nSLEEP ← D10</text><text x="60" y="385">nFAULT → D11</text>
<text x="60" y="430">AOUT1 / AOUT2 → left motor</text>
<text x="60" y="465">BOUT1 / BOUT2 → right motor</text>
<text x="60" y="498" class="small">Motor power: VM / GND</text>
<rect x="470" y="130" width="340" height="390" rx="12" class="box"/>
<text x="490" y="165" class="heading">Nano 33 BLE Sense Rev2</text>
<text x="490" y="210">D3 / D5 · left motor</text><text x="490" y="245">D6 / D9 · right motor</text>
<text x="490" y="280">D10 · enable</text><text x="490" y="315">D11 · fault input</text>
<text x="490" y="350">D2 / D4 / D7 · triggers</text><text x="490" y="385">A0 / A1 / A2 · echo inputs</text>
<text x="490" y="430">D12 → run button → GND</text>
<text x="490" y="465">USB → board power</text>
<text x="490" y="498" class="small">3.3 V GPIO · never apply raw 5 V</text>
<rect x="900" y="130" width="340" height="390" rx="12" class="box"/>
<text x="920" y="165" class="heading">HC-SR04P sensors</text>
<text x="920" y="210">Front TRIG ← D2</text><text x="920" y="245">Left TRIG ← D4</text>
<text x="920" y="280">Right TRIG ← D7</text>
<text x="920" y="330">Front ECHO → A0</text>
<text x="920" y="365">Left ECHO → A1</text>
<text x="920" y="400">Right ECHO → A2</text>
<text x="920" y="445">All VCC → Nano 3V3</text>
<text x="920" y="480">All GND → common ground</text>
<path d="M380 230H470 M380 270H470 M380 310H470 M810 230H900 M810 350H900" class="wire"/>
<text x="397" y="215" class="small">PWM</text><text x="393" y="296" class="small">control</text>
<text x="824" y="215" class="small">TRIG</text><text x="817" y="335" class="small">ECHO</text>
<rect x="40" y="550" width="760" height="170" rx="12" class="divider"/>
<text x="60" y="584" class="heading">HC-SR04P powered at 3.3 V</text><text x="60" y="623">VCC to Nano 3V3; GND to common ground</text><text x="60" y="658">TRIG and ECHO connect directly to assigned GPIO.</text><text x="60" y="695">No echo dividers with this 3.3 V supply.</text><rect x="830" y="550" width="410" height="170" rx="12" class="divider"/>
<text x="850" y="584" class="heading">Enable and fault resistors</text>
<text x="850" y="621">nSLEEP → 10kΩ → GND</text>
<text x="850" y="656">nFAULT → 10kΩ → Nano 3V3</text>
<text x="850" y="692" class="small">No carrier pull-up to VM above 3.3 V.</text>
<rect x="40" y="750" width="1200" height="160" rx="12" class="power"/>
<text x="60" y="786" class="heading">Power and common ground</text>
<text x="60" y="822">Motor supply → switch + fuse → driver VM. Match voltage and stall current to the motors and carrier.</text>
<text x="60" y="854">AA pack to Pololu S7V7F5 to USB 5 V to Nano. Nano 3V3 to HC-SR04P VCC.</text>
<text x="60" y="886">Join all grounds; route motor current directly to driver/supply. Use carrier decoupling and bulk capacitance.</text>
<text x="40" y="943" class="small">Signal connections by carrier label. Full pin assignments and setup: hardware/wiring.md.</text>
</svg>
